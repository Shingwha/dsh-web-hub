# dsh-web-hub — provider-owned search and fetch tools behind one switchboard.
#
# `providers` holds per-service connection settings; secrets never appear here,
# only `keyRef` names a credential in the harness credential store.
# `tools` is the single rule the runtime follows: a tool is visible to the model
# exactly when its switch is true. Built-in tools share the same map, so
# `web_search` / `web_fetch` are managed here like any provider tool.
#
# Every provider below answers without a key. A key raises that provider's
# limits, and every keyless connection is rate limited.
- insert:
    - id: web-hub
      name: dsh-web-hub
      config:
        providers:
          anysearch:
            title: AnySearch
            baseURL: 'https://api.anysearch.com/mcp'
            keyRef: ANYSEARCH_API_KEY
            consoleURL: 'https://www.anysearch.com/console/api-keys'
            maxResults: 0
            timeoutMs: 30000
          exa:
            title: Exa
            baseURL: 'https://mcp.exa.ai/mcp'
            keyRef: EXA_API_KEY
            consoleURL: 'https://dashboard.exa.ai/api-keys'
            maxResults: 0
            timeoutMs: 30000
          tavily:
            title: Tavily
            baseURL: 'https://mcp.tavily.com/mcp/'
            keyRef: TAVILY_API_KEY
            consoleURL: 'https://app.tavily.com'
            maxResults: 0
            timeoutMs: 30000
          firecrawl:
            title: Firecrawl
            baseURL: 'https://mcp.firecrawl.dev/v2/mcp'
            keyRef: FIRECRAWL_API_KEY
            consoleURL: 'https://www.firecrawl.dev/app/api-keys'
            maxResults: 0
            timeoutMs: 60000
          yuanbao:
            title: 元宝搜索
            baseURL: 'https://api.wsa.cloud.tencent.com/Mcp'
            keyRef: WSA_API_KEY
            consoleURL: 'https://console.cloud.tencent.com/wsapi/index?tab=apikey'
            maxResults: 0
            timeoutMs: 30000
        tools:
          # Built-ins stay on: installing this plugin must not remove a tool
          # the model could already use. Everything else is opt-in.
          web_search: true
          web_fetch: true
          anysearch_search: false
          anysearch_extract: false
          anysearch_get_sub_domains: false
          anysearch_batch_search: false
          anysearch_score: false
          exa_search: false
          exa_extract: false
          tavily_search: false
          tavily_extract: false
          # Crawl, map, and research need a Tavily API key; keyless covers search and extract.
          tavily_crawl: false
          tavily_map: false
          tavily_research: false
          firecrawl_search: false
          yuanbao_search: false
          firecrawl_extract: false
