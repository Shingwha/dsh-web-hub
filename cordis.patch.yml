# dsh-web-hub — provider-owned search and fetch tools behind one switchboard.
#
# `providers` holds per-service connection settings; secrets never appear here,
# only `keyRef` names a credential in the harness credential store.
# `tools` is the single rule the runtime follows: a tool is visible to the model
# exactly when its switch is true. Built-in tools share the same map, so
# `web_search` / `web_fetch` are managed here like any provider tool.
#
# Every provider below works without a key. A key raises the rate limit, and
# `firecrawl_search` is the one tool that still requires one.
- insert:
    - id: web-hub
      name: dsh-web-hub
      config:
        providers:
          anysearch:
            title: AnySearch
            baseURL: 'https://api.anysearch.com/mcp'
            keyRef: ANYSEARCH_API_KEY
            consoleURL: 'https://www.anysearch.com/console/api-keys'
            maxResults: 8
            timeoutMs: 30000
          exa:
            title: Exa
            baseURL: 'https://mcp.exa.ai/mcp'
            keyRef: EXA_API_KEY
            consoleURL: 'https://dashboard.exa.ai/api-keys'
            maxResults: 8
            timeoutMs: 30000
          tavily:
            title: Tavily
            baseURL: 'https://mcp.tavily.com/mcp/'
            keyRef: TAVILY_API_KEY
            consoleURL: 'https://app.tavily.com'
            maxResults: 8
            timeoutMs: 30000
          firecrawl:
            title: Firecrawl
            baseURL: 'https://mcp.firecrawl.dev/v2/mcp'
            keyRef: FIRECRAWL_API_KEY
            consoleURL: 'https://www.firecrawl.dev/app/api-keys'
            maxResults: 8
            timeoutMs: 60000
        tools:
          web_search: false
          web_fetch: false
          anysearch_search: true
          anysearch_extract: true
          anysearch_get_sub_domains: false
          anysearch_batch_search: false
          anysearch_score: false
          exa_search: true
          exa_extract: true
          tavily_search: true
          tavily_extract: true
          firecrawl_search: false
          firecrawl_extract: true
